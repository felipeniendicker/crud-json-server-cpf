<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <h1>Atualizar</h1>
        <nav><a href="/">Início</a> <a href="/post/">Cadastrar</a> <a href="/get/">Listar</a> <a href="/put/">Atualizar</a> <a href="/delete/">Excluir</a></nav>
        <form class="busca" onsubmit="buscarDados(); return false;">
            <label for="cpfBusca">CPF:</label>
            <input type="text" id="cpfBusca" required>
            <button type="submit">Buscar</button>
        </form>
        <form id="formulario" onsubmit="atualizarDados(); return false;">
            <label for="id">ID:</label>
            <input type="text" id="id" readonly>
            <fieldset id="campos" disabled>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" required>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" required>
            <label for="rua">Rua:</label>
            <input type="text" id="rua" name="rua" required>
            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro" required>
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" required>
            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" required>
            <label for="rg">RG:</label>
            <input type="text" id="rg" name="rg" required>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required>
                <button type="submit">Atualizar</button>
            </fieldset>
        </form>
        <p id="mensagem" role="status"></p>
    </main>
    <script src="/put/put.js"></script>
</body>
</html>
